<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroVortex | Conformal Mapping Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="hud">
        <div class="hud-item">MACH <span id="val-mach">0.00</span></div>
        <div class="hud-item">IAS <span id="val-speed">0</span> KTS</div>
        <div class="hud-item">LIFT <span id="val-lift">0</span> kN</div>
        <div class="hud-item">DRAG <span id="val-drag">0</span> kN</div>
        <div class="hud-item">AOA <span id="val-aoa-hud">0</span>°</div>
    </header>

    <aside id="controls">
        <div class="control-group">
            <label>MACH NUMBER</label>
            <input type="range" id="input-mach" min="0.1" max="2.5" step="0.01" value="0.3">
        </div>
        <div class="control-group">
            <label>ANGLE OF ATTACK (-45° ~ 45°)</label>
            <input type="range" id="input-aoa" min="-45" max="45" step="1" value="5">
        </div>
        <div class="control-group">
            <label>AIRFOIL THICKNESS</label>
            <input type="range" id="input-thick" min="1.05" max="1.5" step="0.01" value="1.15">
        </div>
        <div class="control-group">
            <label>CAMBER</label>
            <input type="range" id="input-camber" min="-0.3" max="0.3" step="0.01" value="0.1">
        </div>
        <div class="info-tag">Ackeret & Prandtl-Glauert Engine Active</div>
    </aside>

    <div id="stall-warning">⚠️ FLOW SEPARATION / STALL</div>

    <canvas id="simCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
